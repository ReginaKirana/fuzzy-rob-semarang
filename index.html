      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/stlite.js";

        {
          requirements: ["matplotlib"],
          entrypoint: "app.py",
          files: {
            "app.py": `"""
Sistem Peringatan Dini Banjir Rob - Pesisir Semarang
Fuzzy Mamdani (dengan pembanding Fuzzy Sugeno)
Tugas Kelompok 01 - Komputasi Lunak, Informatika Universitas Diponegoro

Versi GUI web (Streamlit). Logika fuzzy sama dengan notebook Colab.
"""
import numpy as np
import pandas as pd
import matplotlib.pyplot as plt
import streamlit as st

# ---------------------------------------------------------------------------
# 1. Variabel dan fungsi keanggotaan
# ---------------------------------------------------------------------------
SEMESTA = {
    'pasang': np.arange(0, 250.1, 0.1),
    'hujan': np.arange(0, 200.1, 0.1),
    'angin': np.arange(0, 60.1, 0.1),
    'siaga': np.arange(0, 100.1, 0.1),
}

# 3 angka = segitiga, 4 angka = trapesium
PARAM = {
    'pasang': {'rendah': [0, 0, 120, 160], 'sedang': [120, 160, 200], 'tinggi': [160, 200, 250, 250]},
    'hujan': {'ringan': [0, 0, 20, 35], 'sedang': [20, 35, 50], 'lebat': [35, 50, 200, 200]},
    'angin': {'lemah': [0, 0, 12, 20], 'sedang': [12, 24, 39], 'kencang': [29, 39, 60, 60]},
    'siaga': {'aman': [0, 0, 15, 35], 'waspada': [15, 35, 55], 'siaga': [45, 65, 85], 'awas': [65, 85, 100, 100]},
}

SATUAN = {'pasang': 'cm', 'hujan': 'mm/hari', 'angin': 'km/jam', 'siaga': 'skor'}
JUDUL = {'pasang': 'Tinggi Pasang Air Laut', 'hujan': 'Curah Hujan Harian',
         'angin': 'Kecepatan Angin dari Laut', 'siaga': 'Level Siaga Rob (Output)'}


def trapmf(x, p):
    a, b, c, d = p
    x = np.asarray(x, dtype=float)
    naik = np.ones_like(x) if b == a else np.clip((x - a) / (b - a), 0, 1)
    turun = np.ones_like(x) if d == c else np.clip((d - x) / (d - c), 0, 1)
    return np.minimum(naik, turun) * ((x >= a) & (x <= d))


def trimf(x, p):
    a, b, c = p
    return trapmf(x, [a, b, b, c])


def mf(x, p):
    """Derajat keanggotaan x (angka atau array) untuk parameter p."""
    hasil = trimf(np.atleast_1d(x), p) if len(p) == 3 else trapmf(np.atleast_1d(x), p)
    return hasil if np.ndim(x) else float(hasil[0])


Y = SEMESTA['siaga']
MF_OUT = {nama: mf(Y, p) for nama, p in PARAM['siaga'].items()}


def fuzzifikasi(pasang, hujan, angin):
    nilai = {'pasang': pasang, 'hujan': hujan, 'angin': angin}
    return {var: {h: mf(nilai[var], p) for h, p in PARAM[var].items()} for var in nilai}


# ---------------------------------------------------------------------------
# 2. Rule base (27 rule): (pasang, hujan, angin, output)
# ---------------------------------------------------------------------------
RULES = [
    ('rendah', 'ringan', 'lemah', 'aman'), ('rendah', 'ringan', 'sedang', 'aman'), ('rendah', 'ringan', 'kencang', 'aman'),
    ('rendah', 'sedang', 'lemah', 'aman'), ('rendah', 'sedang', 'sedang', 'waspada'), ('rendah', 'sedang', 'kencang', 'waspada'),
    ('rendah', 'lebat', 'lemah', 'waspada'), ('rendah', 'lebat', 'sedang', 'waspada'), ('rendah', 'lebat', 'kencang', 'waspada'),
    ('sedang', 'ringan', 'lemah', 'waspada'), ('sedang', 'ringan', 'sedang', 'waspada'), ('sedang', 'ringan', 'kencang', 'siaga'),
    ('sedang', 'sedang', 'lemah', 'waspada'), ('sedang', 'sedang', 'sedang', 'siaga'), ('sedang', 'sedang', 'kencang', 'siaga'),
    ('sedang', 'lebat', 'lemah', 'siaga'), ('sedang', 'lebat', 'sedang', 'siaga'), ('sedang', 'lebat', 'kencang', 'awas'),
    ('tinggi', 'ringan', 'lemah', 'siaga'), ('tinggi', 'ringan', 'sedang', 'awas'), ('tinggi', 'ringan', 'kencang', 'awas'),
    ('tinggi', 'sedang', 'lemah', 'awas'), ('tinggi', 'sedang', 'sedang', 'awas'), ('tinggi', 'sedang', 'kencang', 'awas'),
    ('tinggi', 'lebat', 'lemah', 'awas'), ('tinggi', 'lebat', 'sedang', 'awas'), ('tinggi', 'lebat', 'kencang', 'awas'),
]

Z_SUGENO = {'aman': 10, 'waspada': 35, 'siaga': 65, 'awas': 90}


# ---------------------------------------------------------------------------
# 3. Inferensi Mamdani dan Sugeno
# ---------------------------------------------------------------------------
def evaluasi_rule(mu):
    """Hitung alpha tiap rule dengan operator AND = min."""
    hasil = []
    for i, (tp, th, ta, out) in enumerate(RULES, start=1):
        alpha = min(mu['pasang'][tp], mu['hujan'][th], mu['angin'][ta])
        hasil.append((i, tp, th, ta, out, alpha))
    return hasil


def centroid(x, y):
    """Centroid eksak dari kurva linear sepotong-sepotong (sama dengan skfuzzy)."""
    dx = np.diff(x)
    x1, x2, y1, y2 = x[:-1], x[1:], y[:-1], y[1:]
    luas = np.sum(dx * (y1 + y2) / 2)
    momen = np.sum(dx * (x1 * (2 * y1 + y2) + x2 * (y1 + 2 * y2)) / 6)
    return float(momen / luas) if luas > 0 else 0.0


def mamdani(pasang, hujan, angin):
    mu = fuzzifikasi(pasang, hujan, angin)
    agregasi = np.zeros_like(Y)
    for *_, out, alpha in evaluasi_rule(mu):
        if alpha > 0:
            agregasi = np.fmax(agregasi, np.fmin(alpha, MF_OUT[out]))  # implikasi min, agregasi max
    return centroid(Y, agregasi), agregasi


def sugeno(pasang, hujan, angin):
    rules = evaluasi_rule(fuzzifikasi(pasang, hujan, angin))
    penyebut = sum(alpha for *_, alpha in rules)
    return float(sum(alpha * Z_SUGENO[out] for *_, out, alpha in rules) / penyebut) if penyebut else 0.0


def kategori(z):
    return 'Aman' if z < 25 else 'Waspada' if z < 50 else 'Siaga' if z < 75 else 'Awas'


WARNA = {'Aman': '#2e7d32', 'Waspada': '#f9a825', 'Siaga': '#ef6c00', 'Awas': '#c62828'}
PESAN = {
    'Aman': 'Kondisi normal. Tidak ada tindakan khusus.',
    'Waspada': 'Pantau perkembangan pasang dan cuaca. Periksa saluran air.',
    'Siaga': 'Siapkan pompa dan karung pasir. Warga di dataran rendah bersiap.',
    'Awas': 'Rob besar sangat mungkin terjadi. Amankan barang dan siap evakuasi.',
}


# ---------------------------------------------------------------------------
# 4. Grafik
# ---------------------------------------------------------------------------
def gambar_mf(ax, var, x=None):
    for nama, p in PARAM[var].items():
        ax.plot(SEMESTA[var], mf(SEMESTA[var], p), label=nama.capitalize(), linewidth=2)
    if x is not None:
        ax.axvline(x, color='black', linestyle='--', linewidth=1.2)
    ax.set_title(JUDUL[var], fontsize=11)
    ax.set_xlabel(SATUAN[var])
    ax.set_ylabel('μ')
    ax.set_ylim(-0.05, 1.1)
    ax.legend(fontsize=8)
    ax.grid(alpha=0.3)


def gambar_proses(pasang, hujan, angin):
    z, agregasi = mamdani(pasang, hujan, angin)
    fig, axes = plt.subplots(2, 2, figsize=(11, 7))
    for ax, var, x in zip(axes.flat[:3], ['pasang', 'hujan', 'angin'], [pasang, hujan, angin]):
        gambar_mf(ax, var, x)
    ax = axes.flat[3]
    for nama, kurva in MF_OUT.items():
        ax.plot(Y, kurva, linestyle=':', linewidth=1, label=nama.capitalize())
    ax.fill_between(Y, agregasi, color='tab:blue', alpha=0.45, label='Agregasi')
    ax.axvline(z, color='red', linewidth=2, label=f'Centroid = {z:.2f}')
    ax.set_title(f'Output: {z:.2f} ({kategori(z)})', fontsize=11)
    ax.set_xlabel('skor')
    ax.set_ylim(-0.05, 1.1)
    ax.legend(fontsize=8)
    ax.grid(alpha=0.3)
    fig.tight_layout()
    return fig


# ---------------------------------------------------------------------------
# 5. Antarmuka
# ---------------------------------------------------------------------------
st.set_page_config(page_title='Peringatan Dini Banjir Rob Semarang', page_icon='🌊', layout='wide')

SKENARIO = {
    'Normal': (100, 5, 10),
    'Musim hujan': (160, 60, 20),
    'Ekstrem': (200, 120, 40),
    'Mei 2022': (210, 10, 25),
    'Skenario A': (110, 45, 15),
    'Skenario B': (150, 40, 22),
}

for kunci, awal in (('pasang', 150), ('hujan', 40), ('angin', 22)):
    st.session_state.setdefault(kunci, awal)


def pakai_skenario(nama):
    st.session_state.pasang, st.session_state.hujan, st.session_state.angin = SKENARIO[nama]


with st.sidebar:
    st.header('Input')
    st.slider('Tinggi pasang air laut (cm)', 0, 250, step=1, key='pasang')
    st.slider('Curah hujan harian (mm/hari)', 0, 200, step=1, key='hujan')
    st.slider('Kecepatan angin dari laut (km/jam)', 0, 60, step=1, key='angin')
    st.subheader('Contoh skenario')
    kolom = st.columns(2)
    for i, nama in enumerate(SKENARIO):
        kolom[i % 2].button(nama, on_click=pakai_skenario, args=(nama,))

p, h, a = st.session_state.pasang, st.session_state.hujan, st.session_state.angin
z_m, _ = mamdani(p, h, a)
z_s = sugeno(p, h, a)
status = kategori(z_m)

st.title('🌊 Sistem Peringatan Dini Banjir Rob – Pesisir Semarang')
st.caption('Fuzzy Mamdani dengan pembanding Fuzzy Sugeno · Tugas Kelompok 01 Komputasi Lunak, '
           'Informatika Universitas Diponegoro · Data bersifat simulasi')

st.markdown(
    f'''<div style="padding:20px;border-radius:12px;background:{WARNA[status]};color:white;text-align:center;margin-bottom:12px">
    <div style="font-size:15px;letter-spacing:1px">LEVEL SIAGA ROB</div>
    <div style="font-size:44px;font-weight:700;line-height:1.2">{status.upper()}</div>
    <div style="font-size:16px">{PESAN[status]}</div></div>''',
    unsafe_allow_html=True,
)

c1, c2, c3 = st.columns(3)
c1.metric('Skor Mamdani (centroid)', f'{z_m:.2f}', kategori(z_m), delta_color='off')
c2.metric('Skor Sugeno (rata-rata terbobot)', f'{z_s:.2f}', kategori(z_s), delta_color='off')
c3.metric('Input', f'{p} cm · {h} mm · {a} km/j')

tab1, tab2, tab3, tab4 = st.tabs(['Proses inferensi', 'Fuzzifikasi & rule aktif', 'Rule base', 'Tentang model'])

with tab1:
    fig = gambar_proses(p, h, a)
    st.pyplot(fig)
    plt.close(fig)
    st.caption('Garis putus-putus = posisi input. Luasan biru = hasil agregasi; garis merah = titik centroid.')

with tab2:
    mu = fuzzifikasi(p, h, a)
    st.subheader('Langkah 1 – Fuzzifikasi')
    baris = [[var.capitalize(), nama.capitalize(), round(v, 4)] for var, d in mu.items() for nama, v in d.items()]
    st.dataframe(pd.DataFrame(baris, columns=['Variabel', 'Himpunan', 'μ']), hide_index=True)
    st.subheader('Langkah 2 – Rule yang aktif (α > 0)')
    aktif = [[f'R{i}', tp, th, ta, out, round(al, 4)] for i, tp, th, ta, out, al in evaluasi_rule(mu) if al > 0]
    st.dataframe(pd.DataFrame(aktif, columns=['Rule', 'Pasang', 'Hujan', 'Angin', 'Output', 'α']),
                 hide_index=True)

with tab3:
    tabel_rule = pd.DataFrame(RULES, columns=['Pasang', 'Hujan', 'Angin', 'Level Siaga'])
    tabel_rule.insert(0, 'Rule', [f'R{i}' for i in range(1, 28)])
    st.dataframe(tabel_rule, hide_index=True, height=600)

with tab4:
    st.markdown('''
**Input:** tinggi pasang (cm), curah hujan harian (mm/hari), kecepatan angin dari laut (km/jam).
**Output:** level siaga 0–100 → Aman (< 25), Waspada (25–50), Siaga (50–75), Awas (≥ 75).

| Variabel | Himpunan (segitiga / trapesium) | Dasar batas |
|---|---|---|
| Tinggi pasang | Rendah [0,0,120,160] · Sedang [120,160,200] · Tinggi [160,200,250,250] | Pasang harian ±148 cm, tanggul 2 m, rob Mei 2022 = 210 cm |
| Curah hujan | Ringan [0,0,20,35] · Sedang [20,35,50] · Lebat [35,50,200,200] | Kategori hujan BMKG |
| Kecepatan angin | Lemah [0,0,12,20] · Sedang [12,24,39] · Kencang [29,39,60,60] | Skala Beaufort |
| Level siaga | Aman [0,0,15,35] · Waspada [15,35,55] · Siaga [45,65,85] · Awas [65,85,100,100] | Titik potong 25, 50, 75 |

**Mamdani:** AND = min, implikasi = min, agregasi = max, defuzzifikasi centroid.
**Sugeno orde-0:** rule sama, konsekuen konstanta (Aman 10, Waspada 35, Siaga 65, Awas 90), rata-rata terbobot.
''')
    fig, axes = plt.subplots(2, 2, figsize=(11, 6.5))
    for ax, var in zip(axes.flat, ['pasang', 'hujan', 'angin', 'siaga']):
        gambar_mf(ax, var)
    fig.tight_layout()
    st.pyplot(fig)
    plt.close(fig)
`,
          },
        },
